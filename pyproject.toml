[project]
name = "bleachbit"
version = "2025.2.9.0"
description = "Clean Your System and Free Disk Space"
readme = "README_soda.md"
requires-python = ">=3.10"
dependencies = ["msys2_env", "winshell"]


[project.urls]
Repository = "https://github.com/soda92/bleachbit"

[project.scripts]
bleachbit = "bleachbit_loader.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
packages = ["bleachbit", "bleachbit.markovify", "bleachbit_loader"]
# include = ["*.exe", "*.ps1"]

[tool.hatch.build.targets.wheel]
packages = ["bleachbit", "bleachbit.markovify", "bleachbit_loader"]
